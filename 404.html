<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="icon" type="image/png" href="images/yslogo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Serif SC', serif; }
    </style>

    <!-- Disable Right Click and Developer Tools -->
    <script>
        // Disable right-click
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Disable keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            // F12
            if (event.code === 'F12') {
                event.preventDefault();
            }
            // Ctrl+Shift+I / Cmd+Option+I
            if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.code === 'KeyI') {
                event.preventDefault();
            }
            // Ctrl+Shift+J / Cmd+Option+J
            if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.code === 'KeyJ') {
                event.preventDefault();
            }
            // Ctrl+U / Cmd+Option+U
            if ((event.ctrlKey || event.metaKey) && event.code === 'KeyU') {
                event.preventDefault();
            }
            // Ctrl+Shift+C / Cmd+Option+C
            if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.code === 'KeyC') {
                event.preventDefault();
            }
        });
        
        // Disable drag on images
        document.addEventListener('dragstart', function(e) {
            if (e.target.nodeName.toUpperCase() === "IMG") {
                e.preventDefault();
            }
        });
    </script>
</head>

<body>
    <section class="bg-white min-h-screen flex items-center justify-center">
      <div class="container mx-auto px-4">
        <div class="flex justify-center">
          <div class="w-full sm:w-10/12 md:w-8/12 text-center">
            <div
              class="bg-[url('https://cdn.dribbble.com/users/285475/screenshots/2083086/dribbble_1.gif')] h-[250px] sm:h-[350px] md:h-[400px] bg-center bg-no-repeat bg-contain"
              aria-hidden="true"
            >
              <h1 class="text-center text-black text-6xl sm:text-7xl md:text-8xl pt-6 sm:pt-8 font-bold">
                404
              </h1>
            </div>

            <div class="mt-[-50px]">
              <h3 class="text-2xl text-black sm:text-3xl font-bold mb-4">
                Look like you're lost
              </h3>
              <p class="mb-6 text-black sm:mb-5">
                The page you are looking for is not available!
              </p>

              <a
                href="index.html"
                class="inline-block px-6 py-3 my-5 text-white bg-green-600 hover:bg-green-700 rounded-lg text-sm font-medium transition-colors shadow-sm"
              >
                Go to Home
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
</body>
</html>
